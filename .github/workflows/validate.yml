name: validate-corpus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and reproduce all artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fetch and verify configured SWAT+ sources
        run: |
          swatref source fetch main
          swatref source fetch release_62_0_0
          swatref source show main
          swatref source show release_62_0_0
      - name: Unit and pinned-source tests
        run: pytest -q
      - name: Require a current corpus
        run: swatref docs status --verbose --require-current
      - name: Grounding checks
        run: swatref docs check
      - name: Verify Phase 0 parser baseline and rich snapshot
        run: swatref docs baseline
      - name: Compare both parsers field by field
        run: swatref docs parity --json reports/parser-baseline/parity-main-cb442f7c05fc.json
      - name: Run every consumer against the fparser2 index
        run: swatref docs verify-consumers --json reports/parser-baseline/consumers-main-cb442f7c05fc.json
      - name: Render and build site
        run: |
          swatref docs render
          mkdocs build --strict
      - name: Audit rendered source links against the pinned checkout
        run: swatref docs check-links
      - name: Rebuild release schema and reports
        run: |
          swatref schema build
          swatref schema ranges
          swatref schema field-map
          git diff --exit-code -- schema_artifacts snapshots/rich reports/parser-baseline
      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: swatplus-reference-corpus-site
          path: _site
      - name: Package rendered site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy documentation site
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
